vectordb:
  - name: tourism_ollama_chroma
    db_type: chroma
    client_type: persistent
    embedding_model:
      type: ollama
      model_name: bge-m3
      base_url: http://localhost:11434
    collection_name: tourism_ollama
    path: data/processed/autorag_tourism/chroma_ollama

node_lines:
  - node_line_name: retrieve_node_line
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: [5, 10, 20, 40]
        modules:
          - module_type: bm25
            bm25_tokenizer: [space, ko_kiwi]

      - node_type: semantic_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: [5, 10, 20, 40]
        modules:
          - module_type: vectordb
            vectordb: tourism_ollama_chroma

      - node_type: hybrid_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: [5, 10, 20, 40]
        modules:
          - module_type: hybrid_rrf
            weight_range: (4, 80)
